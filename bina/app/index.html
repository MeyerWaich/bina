<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Bina</title>
<style>
  :root{
    --bg:#121316; --bg2:#1A1C20; --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.09);
    --text:#F3F3F1; --mute:rgba(243,243,241,.56); --faint:rgba(243,243,241,.32);
    --warm:#FFD49A; --warmText:#2A1C08; --red:#FF6B5E; --ok:#9BE3B0;
    --r-xl:26px; --r-lg:20px; --r-md:14px;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
    --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
    --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
  svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  section{display:none;padding:0 0 32px}
  section.on{display:block}
  .pad{padding:0 18px}
  h2.sec{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:30px 18px 12px;display:flex;align-items:center;justify-content:space-between}

  /* hero */
  .hero{position:relative;min-height:calc(270px + var(--safe-t));padding:calc(18px + var(--safe-t)) 18px 22px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,19,22,.15) 0%,rgba(18,19,22,.35) 45%,var(--bg) 100%)}
  .hero > *:not(.bgimg){position:relative;z-index:1}
  .topbar{position:absolute!important;top:calc(14px + var(--safe-t));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
  .wordmark{font-size:12px;font-weight:700;letter-spacing:.42em;opacity:.9}
  .iconbtn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center}
  .hello{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.02}
  .status{font-size:16px;line-height:1.45;color:rgba(243,243,241,.82);margin-top:8px;max-width:34ch}
  .status .w{color:var(--red);font-weight:600}
  .alert{margin:14px 18px 0;background:rgba(255,107,94,.13);border:1px solid rgba(255,107,94,.3);color:#FFC2BB;border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.4}
  .alert b{color:var(--red)}

  /* glass card */
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .live{margin:0 18px;padding:6px 16px}
  .livesum{display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:15px;color:var(--mute);border-bottom:1px solid var(--line)}
  .livesum b{color:var(--text);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(155,227,176,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(155,227,176,0)}100%{box-shadow:0 0 0 0 rgba(155,227,176,0)}}
  .lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .lrow:last-child{border-bottom:0}
  .lrow .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);flex:none}
  .lrow .ic.warm{background:var(--warm);color:var(--warmText)}
  .lrow .tx{flex:1;min-width:0}
  .lrow .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .sub{font-size:13px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mute)}
  .pillbtn{flex:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--glass2)}
  .more{display:block;width:100%;text-align:center;padding:12px 0 8px;font-size:14px;color:var(--mute);font-weight:500}
  .quiet{padding:14px 0;color:var(--mute);font-size:15px}

  /* scene cards */
  .scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
  .scene{position:relative;aspect-ratio:4/5;border-radius:var(--r-xl);overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;isolation:isolate;transition:transform .15s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .scene:active{transform:scale(.97)}
  .scene .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
  .scene::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.62) 100%)}
  .scene .nm{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .scene .does{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .scene .does span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scene .does svg.i{width:14px;height:14px}
  .scene .tag{position:absolute;top:12px;left:12px;font-size:12px;font-weight:600;padding:5px 10px 5px 8px;border-radius:999px;background:var(--warm);color:var(--warmText);display:none;align-items:center;gap:6px}
  .scene .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warmText)}
  .scene.active .tag{display:inline-flex}
  .scene.active{box-shadow:0 0 0 2px var(--warm),0 10px 40px -10px rgba(255,212,154,.45)}
  .scene .info{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
  .scene .info svg.i{width:16px;height:16px}
  .scene .flash{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,230,190,.75),rgba(255,230,190,0) 60%);opacity:0;pointer-events:none;transition:opacity .6s}
  .scene.run .flash{opacity:1;transition:opacity .08s}
  .scene.new{background:var(--glass);border:1.5px dashed rgba(255,255,255,.18);align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--mute)}
  .scene.new::before{display:none}
  .scene.new svg.i{width:28px;height:28px}
  .scene.new .nm{font-size:17px;color:var(--text)}
  /* light moods: the colour of the light each scene makes */
  .m-morning{background:radial-gradient(120% 90% at 20% 0%,#FFD08A 0%,#F08A5D 38%,#5B2A3E 72%,#1D1420 100%)}
  .m-movie{background:radial-gradient(90% 60% at 50% 20%,#3E5BD6 0%,#1B2457 40%,#0B0E1E 80%)}
  .m-dinner{background:radial-gradient(90% 80% at 50% 30%,#FFB45C 0%,#B4511E 40%,#3A160A 75%,#160A06 100%)}
  .m-relax{background:radial-gradient(100% 80% at 70% 10%,#C8B3F0 0%,#6F55A8 40%,#2A1F45 75%,#141019 100%)}
  .m-away{background:linear-gradient(160deg,#AEB8C2 0%,#5B6773 45%,#1C2126 100%)}
  .m-night{background:radial-gradient(28px 28px at 64% 30%,#F4F1E6 0 45%,transparent 50%),radial-gradient(110% 90% at 50% 0%,#2C3C7A 0%,#141B3C 50%,#090B16 100%)}
  .m-party{background:radial-gradient(90% 70% at 20% 10%,#FF6B9D 0%,transparent 60%),radial-gradient(90% 70% at 85% 30%,#8A4DFF 0%,transparent 60%),#1A0E2A}
  .m-focus{background:linear-gradient(170deg,#F6F7F2 0%,#AFC2D3 45%,#2B3642 100%)}
  .m-default{background:linear-gradient(165deg,#7D848E 0%,#3A3F47 50%,#16181B 100%)}

  /* rooms */
  .rooms{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rooms::-webkit-scrollbar{display:none}
  .room{flex:0 0 46%;max-width:200px;aspect-ratio:1/1.1;border-radius:var(--r-lg);overflow:hidden;position:relative;scroll-snap-align:start;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
  .room .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
  .room::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.65) 100%)}
  .room .nm{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
  .room .st{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:3px;line-height:1.35}
  .room .lit{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .room .lit.on{background:var(--warm);color:var(--warmText)}
  .room .lit svg.i{width:15px;height:15px}
  .r-off{background:linear-gradient(160deg,#2A2D33 0%,#17191C 100%)}
  .r-on{background:radial-gradient(110% 90% at 30% 10%,#7A5A35 0%,#3A2C1E 45%,#17140F 100%)}

  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 36px);margin:22px 18px 0;padding:16px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--line);font-size:16px;font-weight:600}

  .event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .event:last-child{border-bottom:0}
  .event img{flex:none;width:96px;height:66px;object-fit:cover;border-radius:12px;background:var(--glass2)}
  .event .t{font-size:12px;color:var(--mute)}
  .event .h{font-size:15px;font-weight:600;margin:2px 0}
  .event .d{font-size:14px;line-height:1.35;color:rgba(243,243,241,.85)}

  /* sheets */
  .sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.5)}
  .sheet.on{display:flex;animation:fade .18s ease}
  .sheet .panel{position:relative;width:100%;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:0 0 calc(24px + var(--safe-b));animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{background:rgba(0,0,0,0)}}
  .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:10px auto 0;position:relative;z-index:3}
  .shead{position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;overflow:hidden;border-radius:28px 28px 0 0;margin-top:-15px;isolation:isolate}
  .shead .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
  .shead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(26,28,32,0) 20%,var(--bg2) 100%)}
  .shead h3{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em}
  .shead p{color:var(--mute);font-size:15px;margin-top:4px}
  .shead .x{position:absolute;top:22px;right:16px}
  .sbody{padding:4px 18px 0}
  .sh3{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;padding:18px 18px 6px}
  .group{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 6px}
  .row2{display:flex;gap:10px;margin-top:16px}
  .row2 > *{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:var(--r-md);font-size:16px;font-weight:600;background:var(--glass2)}
  .btn.primary{background:var(--warm);color:var(--warmText)}
  .btn.danger{color:var(--red)}
  .choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--line);margin-top:10px}
  .choice .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);flex:none}
  .choice b{display:block;font-size:16px}
  .choice small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px;line-height:1.35}
  .field{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);color:var(--text);outline:none;margin-top:10px}
  .field:focus{border-color:rgba(255,212,154,.6)}
  .moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .moods button{width:44px;height:44px;border-radius:12px;border:2px solid transparent}
  .moods button[aria-pressed=true]{border-color:var(--warm)}
  .sug{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .sug .sw{width:46px;height:46px;border-radius:12px;flex:none}
  .sug .tx{flex:1;min-width:0}
  .sug .tx b{display:block}
  .sug .tx small{color:var(--mute);font-size:13.5px}

  /* device controls inside a room */
  .dev{padding:12px 0;border-bottom:1px solid var(--line)}
  .dev:last-child{border-bottom:0}
  .dev .top{display:flex;align-items:center;gap:12px}
  .dev .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);flex:none}
  .dev .ic.warm{background:var(--warm);color:var(--warmText)}
  .dev .tx{flex:1;min-width:0}
  .dev .nm{font-size:16px}
  .dev .sub{font-size:13px;color:var(--mute);margin-top:1px}
  .slider{position:relative;height:46px;border-radius:14px;background:var(--glass2);margin-top:10px;overflow:hidden;touch-action:none;cursor:pointer}
  .slider .fill{position:absolute;inset:0 auto 0 0;background:var(--warm)}
  .slider.cool .fill{background:#DCE6F2}
  .slider .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:600;color:var(--text);mix-blend-mode:difference;pointer-events:none}
  .toggle{flex:none;width:54px;height:32px;border-radius:16px;background:var(--glass2);position:relative;transition:background .2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle[aria-checked=true]{background:var(--warm)}
  .toggle[aria-checked=true]::after{transform:translateX(22px)}
  .seg{display:flex;gap:8px;margin-top:10px}
  .seg button{flex:1;padding:12px 0;border-radius:12px;background:var(--glass2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  .thermo{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .thermo .big{font-family:var(--display);font-size:46px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .thermo button{width:52px;height:52px;border-radius:50%;background:var(--glass2);font-size:26px;font-weight:300}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;padding:9px 14px;border-radius:999px;background:var(--glass2);font-size:14px;font-weight:500}
  .chips button[aria-pressed=true]{background:var(--warm);color:var(--warmText)}
  .np{display:flex;gap:12px;align-items:center;margin-top:10px}
  .np img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--glass2)}
  .np .ctl{display:flex;gap:6px;margin-left:auto}
  .np .ctl button{width:44px;height:44px;border-radius:50%;background:var(--glass2);display:grid;place-items:center}


  /* compact hero so the whole home fits on one screen */
  .hero.compact{min-height:calc(150px + var(--safe-t));padding:calc(58px + var(--safe-t)) 18px 12px}
  .m-sky{background:radial-gradient(20px 20px at 58% 22%,rgba(244,241,230,.9) 0 45%,transparent 52%),radial-gradient(110% 90% at 50% 0%,#2C3C7A 0%,#141B3C 50%,#090B16 100%)}
  .live .lrow{padding:9px 0}
  .live .lrow .ic{width:32px;height:32px}
  .live .more{padding:9px 0 6px}
  .live .livesum{padding:10px 0 8px}
  .alert{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 14px;margin-bottom:10px}
  .hero.compact + .alert{margin-top:0}
  .hero.compact .hello{font-size:30px}
  .hero.compact .status{font-size:15px}
  h2.sec .view{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;padding:7px 12px;border-radius:999px;background:var(--glass)}
  h2.sec .view svg.i{width:16px;height:16px}
  h2.sec.tight{margin-top:22px;margin-bottom:10px}

  /* scene orbs: each scene is a sphere of its own light */
  .orbs{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
  .orbs::-webkit-scrollbar{display:none}
  .orb{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:7px;scroll-snap-align:start;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .orb .ball{position:relative;width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 -10px 18px rgba(0,0,0,.35),inset 0 6px 14px rgba(255,255,255,.18),0 6px 18px -6px rgba(0,0,0,.6);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
  .orb .ball::after{content:"";position:absolute;inset:6px 14px auto 14px;height:16px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));filter:blur(1px)}
  .orb:active .ball{transform:scale(.9)}
  .orb .lbl{font-size:12.5px;font-weight:500;text-align:center;line-height:1.2;color:rgba(243,243,241,.86);max-width:76px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .orb.active .ball{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--warm),0 0 26px 2px rgba(255,212,154,.55),inset 0 -10px 18px rgba(0,0,0,.35)}
  .orb.active .lbl{color:var(--warm);font-weight:600}
  .orb .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--warm);opacity:0;transform:scale(1);pointer-events:none}
  .orb.run .ring{animation:ripple .7s ease-out}
  @keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
  .orb.new .ball{background:var(--glass);border:1.5px dashed rgba(255,255,255,.22);box-shadow:none;display:grid;place-items:center;color:var(--mute)}
  .orb.new .ball::after{display:none}

  /* compact room tiles */
  .tiles{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:calc((100% - 36px - 16px) / 2.6);gap:8px;padding:0 18px 2px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0 18px}
  .tiles::-webkit-scrollbar{display:none}
  .tile{scroll-snap-align:start}
  .tile.more{align-items:center;justify-content:center;color:var(--mute);font-weight:600;font-size:15px}
  .tile{position:relative;overflow:hidden;border-radius:16px;padding:9px 10px;min-height:60px;text-align:left;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
  .tile.lit{background:radial-gradient(120% 120% at 0% 0%,rgba(255,212,154,.38) 0%,rgba(255,212,154,.08) 55%,rgba(255,255,255,.04) 100%);border-color:rgba(255,212,154,.28)}
  .tile .nm{font-size:14px;font-weight:600;line-height:1.15;padding-right:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .st{font-size:11.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

// ---------- live status ----------
function liveHTML(L) {
  const sum = [];
  if (L.lights.length) sum.push(t("nL")(L.lights.length));
  if (L.audio.length) sum.push(t("nA")(L.audio.length));
  if (L.video.length) sum.push(t("nV")(L.video.length));
  const c = L.climate[0];
  if (c && c.mode !== "off" && c.target != null) sum.push(`${(t("hvac")[c.mode] || c.mode).toLowerCase()} ${t("to")} ${Math.round(c.target)}°`);
  const rows = [];
  L.audio.forEach(x => rows.push(`<div class="lrow"><span class="ic warm">${ic("music")}</span><div class="tx"><div class="nm">${esc(x.room || x.name)}</div><div class="sub">${esc([x.title, x.artist].filter(Boolean).join(", ") || x.source)}</div></div>${x.volume != null ? `<span class="val">${x.volume}%</span>` : ""}${x.state === "playing" ? `<button class="pillbtn" data-act="pause" data-id="${esc(x.id)}">${t("pause")}</button>` : `<button class="pillbtn" data-act="play" data-id="${esc(x.id)}">${t("play")}</button>`}</div>`));
  L.video.forEach(x => rows.push(`<div class="lrow"><span class="ic warm">${ic("tv")}</span><div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub">${esc([x.source, x.title].filter(Boolean).join(", ") || x.room || "")}</div></div><button class="pillbtn" data-act="off" data-id="${esc(x.id)}">${t("off")}</button></div>`));
  L.lights.forEach(x => rows.push(`<div class="lrow"><span class="ic warm">${ic("light")}</span><div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub">${esc(x.room || "")}</div></div>${x.level != null ? `<span class="val">${x.level}%</span>` : ""}<button class="pillbtn" data-act="off" data-id="${esc(x.id)}">${t("off")}</button></div>`));
  L.shades.forEach(x => rows.push(`<div class="lrow"><span class="ic">${ic("shade")}</span><div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub">${esc(x.room || "")}</div></div>${x.position != null ? `<span class="val">${x.position}%</span>` : ""}<button class="pillbtn" data-act="close" data-id="${esc(x.id)}">${t("closeS")}</button></div>`));
  L.climate.forEach(x => rows.push(`<div class="lrow"><span class="ic">${ic("climate")}</span><div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub">${esc(t("hvac")[x.mode] || x.mode)}${x.target != null && x.mode !== "off" ? ` ${t("to")} ${Math.round(x.target)}°` : ""}</div></div>${x.current != null ? `<span class="val">${Math.round(x.current)}°</span>` : ""}</div>`));
  L.other.forEach(x => rows.push(`<div class="lrow"><span class="ic warm">${ic("switch")}</span><div class="tx"><div class="nm">${esc(x.name)}</div><div class="sub">${esc(x.room || "")}</div></div><button class="pillbtn" data-act="off" data-id="${esc(x.id)}">${t("off")}</button></div>`));
  const shown = liveExpanded ? rows : rows.slice(0, 2);
  return `<div class="livesum"><span class="dot on" id="liveDot"></span><span><b>${t("now")}</b> · ${sum.length ? sum.join(", ") : t("nothingOn")}</span></div>
    ${shown.join("")}${rows.length > 2 ? `<button class="more" id="liveMore">${liveExpanded ? t("less") : `${t("seeAll")} (${rows.length})`}</button>` : ""}`;
}

// ---------- scene editor: room by room, exactly what happens ----------
let ED = null;
async function openEditor(id) {
  let dev, raw;
  try { [dev, raw] = await Promise.all([api("api/devices"), id ? api(`api/scene/${encodeURIComponent(id)}/raw`) : Promise.resolve({ name: "", mood: "default", actions: [] })]); } catch { toast(t("offline")); return; }
  ED = { id, name: raw.name, mood: raw.mood, rooms: dev.rooms, unit: dev.unit || "°F", sel: new Map(), orphans: [], open: new Set() };
  loadActions(raw.actions || []);
  for (const r of ED.rooms) if (r.devices.some(d => ED.sel.has(d.id))) ED.open.add(r.room);
  if (!ED.open.size && ED.rooms[0]) ED.open.add(ED.rooms[0].room);
  renderEditor();
}
const devById = (id) => { for (const r of ED.rooms) for (const d of r.devices) if (d.id === id) return { d, room: r.room }; return null; };
function loadActions(actions) {
  ED.sel.clear(); ED.orphans = [];
  for (const a of actions) {
    if (a.music) {
      const room = ED.rooms.find(r => r.room === a.music.room);
      const spk = room?.devices.find(d => d.kind === "speaker");
      if (spk) ED.sel.set(spk.id, { mode: "play", query: a.music.query, volume: a.music.volume_pct ?? 20 }); else ED.orphans.push(a);
      continue;
    }
    for (const id of a.entity_ids || []) {
      const hit = devById(id); if (!hit) { ED.orphans.push({ ...a, entity_ids: [id] }); continue; }
      const { d } = hit, sv = a.service, data = a.data || {};
      if (d.kind === "light") ED.sel.set(id, { on: sv !== "turn_off", level: data.brightness_pct ?? 100 });
      else if (d.kind === "shade") ED.sel.set(id, { position: data.position ?? (sv === "open_cover" ? 100 : sv === "close_cover" ? 0 : 50) });
      else if (d.kind === "climate") ED.sel.set(id, { temp: data.temperature ?? d.target });
      else if (d.kind === "speaker") ED.sel.set(id, { mode: sv === "media_pause" || sv === "turn_off" ? "pause" : "play", query: "", volume: 20 });
      else if (d.kind === "tv" || d.kind === "fan") ED.sel.set(id, { on: sv !== "turn_off" && sv !== "media_pause" });
    }
  }
}
function fillNow() {
  ED.sel.clear();
  for (const r of ED.rooms) for (const d of r.devices) {
    if (d.kind === "light") ED.sel.set(d.id, { on: d.on, level: d.on ? d.level || 100 : 100 });
    else if (d.kind === "shade") ED.sel.set(d.id, { position: d.position });
    else if (d.kind === "climate" && d.mode !== "off") ED.sel.set(d.id, { temp: Math.round(d.target) });
    else if (d.kind === "speaker" && d.playing && d.title) ED.sel.set(d.id, { mode: "play", query: d.title, volume: d.volume });
    else if (d.kind === "tv") ED.sel.set(d.id, { on: d.on });
  }
  for (const r of ED.rooms) if (r.devices.some(d => ED.sel.has(d.id))) ED.open.add(r.room);
}
function defaultsFor(d) {
  if (d.kind === "light") return { on: true, level: d.dimmable ? 70 : 100 };
  if (d.kind === "shade") return { position: d.position ?? 100 };
  if (d.kind === "climate") return { temp: Math.round(d.target || 72) };
  if (d.kind === "speaker") return { mode: "play", query: "", volume: 20 };
  return { on: true };
}
function toActions() {
  const out = []; const onBy = new Map(); const offBy = new Map();
  for (const [id, c] of ED.sel) {
    const hit = devById(id); if (!hit) continue; const { d, room } = hit;
    const domain = id.split(".")[0];
    if (d.kind === "light") {
      if (c.on) { const k = domain + "|" + (d.dimmable ? c.level : 100); if (!onBy.has(k)) onBy.set(k, []); onBy.get(k).push(id); }
      else { if (!offBy.has(domain)) offBy.set(domain, []); offBy.get(domain).push(id); }
    } else if (d.kind === "shade") out.push({ domain: "cover", service: "set_cover_position", entity_ids: [id], data: { position: c.position } });
    else if (d.kind === "climate") out.push({ domain: "climate", service: "set_temperature", entity_ids: [id], data: { temperature: c.temp } });
    else if (d.kind === "speaker") { if (c.mode === "pause") out.push({ domain: "media_player", service: "media_pause", entity_ids: [id] }); else if (c.query.trim()) out.push({ music: { query: c.query.trim(), room, volume_pct: c.volume } }); }
    else if (d.kind === "tv") out.push({ domain: "media_player", service: c.on ? "turn_on" : "turn_off", entity_ids: [id] });
    else if (d.kind === "fan") out.push({ domain: "fan", service: c.on ? "turn_on" : "turn_off", entity_ids: [id] });
  }
  const lights = [];
  for (const [k, ids] of onBy) { const [domain, lv] = k.split("|"); lights.push(domain === "light" ? { domain, service: "turn_on", entity_ids: ids, data: { brightness_pct: +lv } } : { domain, service: "turn_on", entity_ids: ids }); }
  for (const [domain, ids] of offBy) lights.push({ domain, service: "turn_off", entity_ids: ids });
  return [...lights, ...out, ...ED.orphans];
}
function edDevHTML(d) {
  const c = ED.sel.get(d.id); const on = !!c;
  const iconOf = { light: "light", shade: "shade", climate: "climate", speaker: "speaker", tv: "tv", fan: "fan" }[d.kind] || "switch";
  let sum = "", ctl = "";
  const seg = (a, b, val, key) => `<div class="seg mini"><button data-set="${key}" data-v="1" aria-pressed="${val}">${a}</button><button data-set="${key}" data-v="0" aria-pressed="${!val}">${b}</button></div>`;
  const sl = (val, key, cls = "") => `<div class="slider ${cls}" data-edslider="${key}" data-val="${val}"><div class="fill" style="width:${val}%"></div><div class="lab"><span></span><span class="v">${val}%</span></div></div>`;
  if (c) {
    if (d.kind === "light") { sum = c.on ? (d.dimmable ? c.level + "%" : t("onW")) : t("offW"); ctl = seg(t("onW"), t("offW"), c.on, "on") + (c.on && d.dimmable ? sl(c.level, "level") : ""); }
    else if (d.kind === "shade") { sum = c.position + "%"; ctl = sl(c.position, "position", "cool"); }
    else if (d.kind === "climate") { sum = c.temp + "°"; ctl = `<div class="thermo"><button data-step="-1">−</button><span class="big">${c.temp}°</span><button data-step="1">+</button></div>`; }
    else if (d.kind === "speaker") { sum = c.mode === "pause" ? t("pauseW") : (c.query || "…"); ctl = seg(t("playW"), t("pauseW"), c.mode !== "pause", "mode") + (c.mode !== "pause" ? `<input class="field" data-query placeholder="${t("song")}" value="${esc(c.query)}" style="margin-top:8px">` + sl(c.volume, "volume") : ""); }
    else { sum = c.on ? t("onW") : t("offW"); ctl = seg(t("onW"), t("offW"), c.on, "on"); }
  }
  return `<div class="ed-dev${on ? " on" : ""}" data-ed="${esc(d.id)}"><div class="top"><button class="chk" data-chk aria-label="${esc(d.name)}">${ic("check")}</button><span class="nm">${ic(iconOf)} ${esc(d.name)}</span><span class="sum">${esc(sum)}</span></div><div class="ctl">${ctl}</div></div>`;
}
function roomCount(r) { return r.devices.filter(d => ED.sel.has(d.id)).length; }
function renderEditor() {
  const moods = ["morning", "movie", "dinner", "relax", "away", "night", "party", "focus", "default"];
  const rooms = ED.rooms.map(r => { const n = roomCount(r); return `<details class="ed-room" data-edroom="${esc(r.room)}" ${ED.open.has(r.room) ? "open" : ""}><summary><span>${esc(r.room)}</span><span style="display:flex;gap:10px;align-items:center"><span class="cnt${n ? "" : " zero"}">${n}</span>${ic("chev")}</span></summary><div class="ed-body">${r.devices.map(edDevHTML).join("")}</div></details>`; }).join("");
  openSheet(`<p class="sh3">${ED.id ? t("editTitle") : t("newTitle")}</p><div class="sbody">
    <input class="field" id="edName" placeholder="${t("sceneName")}" value="${esc(ED.name)}" maxlength="40">
    <div class="moods">${moods.map(m => `<button class="m-${m}" data-edmood="${m}" aria-pressed="${m === ED.mood}" aria-label="${m}"></button>`).join("")}</div>
    <button class="choice" id="edFill"><span class="ic">${ic("capture")}</span><span><b>${t("fillNow")}</b><small>${t("captureSub")}</small></span></button>
    <div id="edRooms">${rooms}</div></div>
    <div class="stick"><div class="row2" style="margin-top:0"><button class="btn" id="edCancel">${t("cancel")}</button><button class="btn primary" id="edSave">${t("save")}</button></div></div>`);

}
function bindEditor() {
  $("#edName").oninput = (e) => ED.name = e.target.value;
  document.querySelectorAll("[data-edmood]").forEach(b => b.onclick = () => { ED.mood = b.dataset.edmood; document.querySelectorAll("[data-edmood]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  $("#edFill").onclick = () => { buzz(); fillNow(); renderEditor(); toast(t("fillNow")); };

  $("#edSave").onclick = saveEditor;
  document.querySelectorAll("details.ed-room").forEach(dt => dt.addEventListener("toggle", () => dt.open ? ED.open.add(dt.dataset.edroom) : ED.open.delete(dt.dataset.edroom)));

}
function refreshRow(id) {
  const old = document.querySelector(`[data-ed="${CSS.escape(id)}"]`); if (!old) return;
  const { d, room } = devById(id);
  old.outerHTML = edDevHTML(d);
  bindEdRow(document.querySelector(`[data-ed="${CSS.escape(id)}"]`));
  const r = ED.rooms.find(x => x.room === room); const n = roomCount(r);
  const cnt = document.querySelector(`[data-edroom="${CSS.escape(room)}"] .cnt`); if (cnt) { cnt.textContent = n; cnt.classList.toggle("zero", !n); }
}
function bindEdRow(row) {
  const id = row.dataset.ed; const { d } = devById(id);
  row.querySelector("[data-chk]").onclick = () => { buzz(8); ED.sel.has(id) ? ED.sel.delete(id) : ED.sel.set(id, defaultsFor(d)); refreshRow(id); };
  row.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { const c = ED.sel.get(id); const v = b.dataset.v === "1"; if (b.dataset.set === "on") c.on = v; else c.mode = v ? "play" : "pause"; refreshRow(id); });
  row.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { const c = ED.sel.get(id); c.temp = Math.round(c.temp + +b.dataset.step); refreshRow(id); });
  const q = row.querySelector("[data-query]"); if (q) q.oninput = (e) => { ED.sel.get(id).query = e.target.value; row.querySelector(".sum").textContent = e.target.value || "…"; };
  row.querySelectorAll("[data-edslider]").forEach(el => {
    const key = el.dataset.edslider;
    const set = (x) => { const r = el.getBoundingClientRect(); const v = Math.max(key === "level" ? 1 : 0, Math.min(100, Math.round((x - r.left) / r.width * 100))); el.querySelector(".fill").style.width = v + "%"; el.querySelector(".v").textContent = v + "%"; ED.sel.get(id)[key] = v; row.querySelector(".sum").textContent = v + "%"; return v; };
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); set(e.clientX); });
    el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) set(e.clientX); });

async function saveEditor() {
  const name = (ED.name || "").trim();
  if (!name) { $("#edName").focus(); toast(t("sceneName")); return; }
  const actions = toActions();
  if (!actions.length) { toast(t("nothingSel")); return; }
  const r = await post(`api/scene/${encodeURIComponent(ED.id || "__new__")}`, { name, mood: ED.mood, actions }, "PUT").catch(() => ({}));
  if (!r.ok) { toast(t("offline")); return; }
  buzz(); toast(t("saved")); closeSheet(); await loadHome(); openScene(r.id);
}

// room control sheet
async function openRoom(room) { ROOM_OPEN = room; await loadRoom(room, false); }
async function loadRoom(room, quiet) {
  let r; try { r = await api(`api/rooms/${encodeURIComponent(room)}`); } catch { if (!quiet) toast(t("offline")); return; }
  if (ROOM_OPEN !== room) return;
  const lightsOn = r.devices.filter(d => d.kind === "light" && d.on).length, lights = r.devices.filter(d => d.kind === "light").length;
  const body = r.devices.map(devHTML).join("") || `<p class="quiet">${t("noDevices")}</p>`;
  const scroll = $("#panel").scrollTop;
  const html = `<div class="shead"><div class="bg ${r.photo ? "" : lightsOn ? "r-on" : "r-off"}" ${bgStyle(r.photo)}></div>${closeBtn()}
      <h3>${esc(room)}</h3><p>${lights ? (lightsOn ? t("lightsOn")(lightsOn, lights) : t("allLightsOff")) : ""}</p></div>
    <div class="sbody">
      ${lightsOn ? `<div class="row2" style="margin-top:4px"><button class="btn" id="roomOff">${ic("power")} ${t("allLightsOff")}</button></div>` : ""}
      <div class="glass" style="padding:0 14px;margin-top:14px">${body}</div>
      <div class="row2"><button class="btn" id="roomPhoto">${ic("image")} ${t("roomPhoto")}</button></div>
    </div>`;
  if (quiet && $("#sheet").classList.contains("on")) { $("#panel").innerHTML = `<div class="grab"></div>` + html; $("#panel").scrollTop = scroll; }
  else openSheet(html);
  bindClose();
  const ro = $("#roomOff"); if (ro) ro.onclick = async () => { buzz(); await post("api/room", { room, on: false }); setTimeout(() => loadRoom(room, true), 600); };
  $("#roomPhoto").onclick = () => pickPhoto("room", room, () => loadRoom(room, true));
  bindDevices(room);
}
function devHTML(d) {
  const top = (icon, warm, sub, right = "") => `<div class="top"><span class="ic${warm ? " warm" : ""}">${ic(icon)}</span><div class="tx"><div class="nm">${esc(d.name)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>${right}</div>`;
  const tog = (on) => `<button class="toggle" role="switch" aria-checked="${on}" data-toggle="${esc(d.id)}" aria-label="${esc(d.name)}"></button>`;
  const slider = (val, act, cls = "") => `<div class="slider ${cls}" data-slider="${esc(d.id)}" data-act="${act}" data-val="${val}"><div class="fill" style="width:${val}%"></div><div class="lab"><span></span><span class="v">${val}%</span></div></div>`;
  if (d.kind === "light") return `<div class="dev">${top("light", d.on, d.on ? (d.dimmable ? d.level + "%" : t("on")) : t("off"), tog(d.on))}${d.dimmable ? slider(d.on ? d.level : 0, "level") : ""}</div>`;
  if (d.kind === "switch" || d.kind === "fan") return `<div class="dev">${top(d.kind === "fan" ? "fan" : "switch", d.on, "", tog(d.on))}</div>`;
  if (d.kind === "shade") return `<div class="dev">${top("shade", false, d.position + "%")}${slider(d.position, "position", "cool")}<div class="seg"><button data-cover="open" data-id="${esc(d.id)}">${t("openS")}</button><button data-cover="stop" data-id="${esc(d.id)}">${t("stop")}</button><button data-cover="close" data-id="${esc(d.id)}">${t("closeS")}</button></div></div>`;
  if (d.kind === "climate") return `<div class="dev">${top("climate", false, `${t("hvac")[d.mode] || d.mode}${d.current != null ? ` · ${Math.round(d.current)}° ${t("inside")}` : ""}`)}<div class="thermo"><button data-temp="-1" data-id="${esc(d.id)}" data-target="${d.target}">−</button><span class="big">${d.target != null ? Math.round(d.target) + "°" : "—"}</span><button data-temp="1" data-id="${esc(d.id)}" data-target="${d.target}">+</button></div></div>`;
  if (d.kind === "speaker") return `<div class="dev">${top("speaker", d.playing, d.playing ? [d.title, d.artist].filter(Boolean).join(", ") : (d.title ? d.title : ""))}
    <div class="np">${d.art ? `<img src="${esc(d.art)}" alt="">` : ""}<div class="ctl"><button data-media="${d.playing ? "pause" : "play"}" data-id="${esc(d.id)}" aria-label="play">${ic(d.playing ? "pause" : "play")}</button><button data-media="next" data-id="${esc(d.id)}" aria-label="next">${ic("next")}</button></div></div>
    ${d.volume != null ? slider(d.volume, "volume") : ""}</div>`;
  if (d.kind === "tv") return `<div class="dev">${top("tv", d.on, d.on ? d.source || t("on") : t("off"), tog(d.on))}${d.on && d.sources?.length ? `<div class="chips">${d.sources.map(s => `<button data-source="${esc(s)}" data-id="${esc(d.id)}" aria-pressed="${s === d.source}">${esc(s)}</button>`).join("")}</div>` : ""}${d.on && d.volume != null ? slider(d.volume, "volume") : ""}</div>`;
  if (d.kind === "contact") return `<div class="dev">${top("door", d.open, d.open ? t("openState") : t("closedState"))}</div>`;
  if (d.kind === "lock") return `<div class="dev">${top("lock", false, d.state === "locked" ? t("locked") : t("unlockedS"))}</div>`;
  if (d.kind === "camera") return `<div class="dev">${top("camera", false, "")}</div>`;
  return "";
}
function bindDevices(room) {
  const again = () => setTimeout(() => loadRoom(room, true), 700);
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => { buzz(); const on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on); await post("api/set", { entity_id: b.dataset.toggle, action: on ? "on" : "off" }).catch(() => {}); again(); });
  document.querySelectorAll("[data-cover]").forEach(b => b.onclick = async () => { buzz(); await post("api/set", { entity_id: b.dataset.id, action: b.dataset.cover }); again(); });
  document.querySelectorAll("[data-temp]").forEach(b => b.onclick = async () => { buzz(); const v = Math.round(+b.dataset.target + +b.dataset.temp); b.parentElement.querySelector(".big").textContent = v + "°"; document.querySelectorAll(`[data-temp][data-id="${b.dataset.id}"]`).forEach(x => x.dataset.target = v); await post("api/set", { entity_id: b.dataset.id, action: "temp", value: v }); });
  document.querySelectorAll("[data-media]").forEach(b => b.onclick = async () => { buzz(); await post("api/set", { entity_id: b.dataset.id, action: b.dataset.media }); again(); });
  document.querySelectorAll("[data-source]").forEach(b => b.onclick = async () => { buzz(); await post("api/set", { entity_id: b.dataset.id, action: "source", value: b.dataset.source }); again(); });
  document.querySelectorAll("[data-slider]").forEach(el => {
    const set = (clientX) => { const r = el.getBoundingClientRect(); const v = Math.max(0, Math.min(100, Math.round((clientX - r.left) / r.width * 100))); el.dataset.val = v; el.querySelector(".fill").style.width = v + "%"; el.querySelector(".v").textContent = v + "%"; return v; };
    el.addEventListener("pointerdown", (e) => { SLIDING = true; el.setPointerCapture(e.pointerId); set(e.clientX); });
    el.addEventListener("pointermove", (e) => { if (SLIDING && el.hasPointerCapture(e.pointerId)) set(e.clientX); });
    el.addEventListener("pointerup", async (e) => { const v = set(e.clientX); SLIDING = false; buzz(); await post("api/set", { entity_id: el.dataset.slider, action: el.dataset.act, value: v }).catch(() => {}); again(); });
    el.addEventListener("pointercancel", () => { SLIDING = false; });
  });
}

// photos: resize on the phone, upload as JPEG
function pickPhoto(kind, id, done) {
  const inp = $("#filePick"); inp.value = "";
  inp.onchange = () => {
    const f = inp.files?.[0]; if (!f) return;
    toast(t("upload"));
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = async () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const data = c.toDataURL("image/jpeg", .82);
      const r = await post("api/photo", { kind, id, data }).catch(() => ({}));
      toast(r.ok ? t("saved") : t("offline")); done?.();
    };
    img.src = url;
  };
  inp.click();
}

// ---------- talk ----------
const log = $("#log");
const plain = (x) => String(x).replace(/\*\*(.*?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "").replace(/`/g, "");
let hist = []; try { hist = JSON.parse(localStorage.getItem("bina_hist") || "[]"); } catch {}
const saveHist = () => { try { localStorage.setItem("bina_hist", JSON.stringify(hist.slice(-60))); } catch {} };
function add(cls, text, images = [], persist = true) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.textContent = cls.includes("bina") ? plain(text) : text;
  images.forEach(src => { const im = document.createElement("img"); im.src = src; im.alt = ""; d.appendChild(im); });
  log.appendChild(d); $("main").scrollTop = $("main").scrollHeight;
  if (persist && !cls.includes("typing")) { hist.push({ cls, text, images }); saveHist(); }
  return d;
}
function confirmCard(c) {
  const d = document.createElement("div"); d.className = "card";
  const what = c.kind === "service" ? `${c.service.replace(/_/g, " ")}: ${(c.entity_ids || []).map(e => e.split(".")[1].replace(/_/g, " ")).join(", ")}` : c.summary;
  d.innerHTML = `<b>${c.kind === "service" ? t("confirm") : t("routine")}</b>${esc(what)}<div class="row2"><button type="button" class="btn no">${t("cancel")}</button><button type="button" class="btn primary yes">${t("ok")}</button></div>`;
  const go = async (approve) => { d.querySelectorAll("button").forEach(b => b.disabled = true); const r = await post(`api/confirm/${c.id}`, { approve }).catch(() => ({ error: t("offline") })); d.remove(); add("bina", r.reply || r.error || "OK"); };
  d.querySelector(".yes").onclick = () => go(true);
  d.querySelector(".no").onclick = () => go(false);
  log.appendChild(d); $("main").scrollTop = $("main").scrollHeight;
}
async function send(text) {
  text = (text || "").trim(); if (!text) return;
  add("me", text); $("#in").value = "";
  const w = add("bina typing", "…", [], false);
  try { const r = await post("api/chat", { text }); w.remove(); if (r.reply || r.images?.length) add("bina", r.reply || "", r.images || []); (r.confirmations || []).forEach(confirmCard); }
  catch { w.textContent = t("offline"); w.classList.remove("typing"); }
}
$("#f").onsubmit = (e) => { e.preventDefault(); send($("#in").value); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("#mic");
if (!SR) mic.style.display = "none";
else {
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = LANG === "es" ? "es-US" : LANG === "he" ? "he-IL" : "en-US"; rec.interimResults = false;
    mic.classList.add("live"); buzz();
    rec.onresult = (e) => send(e.results[0][0].transcript);
    rec.onend = rec.onerror = () => { mic.classList.remove("live"); rec = null; };
    rec.start();
  };
}

// ---------- activity ----------
async function loadActivity() {
  const [evs, feed, alerts] = await Promise.all([api("api/events").catch(() => []), api("api/feed").catch(() => []), api("api/alerts").catch(() => [])]);
  $("#activity").innerHTML = `<p class="ttl">${t("tAct")}</p>
    <button class="bigbtn" id="briefBtn" style="margin-top:0">${ic("sparkle")} ${t("brief")}</button><div id="briefOut" class="pad"></div>
    ${alerts.length ? `<h2 class="sec">${t("alerts")}</h2><div class="glass list">` + alerts.slice(0, 10).map(a => `<div class="event"><div><div class="t">${when(a.t)}</div><div class="h">${esc(a.title)}</div><div class="d">${esc(a.message)}</div></div></div>`).join("") + `</div>` : ""}
    <h2 class="sec">${t("act")}</h2><div class="glass list">${evs.length ? evs.map(eventRow).join("") : `<p class="empty">${t("noEvents")}</p>`}</div>
    <h2 class="sec">${t("feed")}</h2><div class="glass list">${feed.slice(0, 25).map(i => `<div class="event"><div><div class="t">${when(i.t)} · ${esc(i.who)}</div><div class="h">${esc(i.text)}</div><div class="d">${esc(plain(i.reply || ""))}</div></div></div>`).join("") || `<p class="empty">${t("noEvents")}</p>`}</div>`;
  $("#briefBtn").onclick = async () => { $("#briefBtn").innerHTML = t("writing"); const r = await api("api/brief").catch(() => ({ error: t("offline") })); $("#briefOut").innerHTML = `<div class="card">${esc(plain(r.brief || r.error))}</div>`; $("#briefBtn").innerHTML = `${ic("sparkle")} ${t("brief")}`; };
}

// ---------- boot ----------
(async () => {
  try { const me = await api("api/me"); LANG = me.language === "en" ? "en" : "es"; } catch {}
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
