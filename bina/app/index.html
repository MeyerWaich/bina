<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Bina</title>
<style>
  :root{--ink:#000;--paper:#fff;--bone:#F3F1EC;--mute:#767676;--rule:#E4E4E4;--safe-b:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;padding-top:calc(18px + env(safe-area-inset-top))}
  .wordmark{font-size:13px;font-weight:600;letter-spacing:.42em}
  .house{font-size:12px;color:var(--mute)}
  nav{display:flex;gap:22px;padding:0 20px 12px;border-bottom:1px solid var(--rule)}
  nav button{background:none;border:0;font:inherit;font-size:14px;color:var(--mute);padding:6px 0;border-bottom:1.5px solid transparent}
  nav button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  section{display:none;padding:16px 20px 24px}
  section.on{display:block}
  .msg{max-width:86%;margin:0 0 12px;font-size:16px;line-height:1.4;white-space:pre-wrap}
  .msg.me{margin-left:auto;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:18px 18px 4px 18px}
  .msg.bina{padding:2px 0}
  .msg.bina::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:10px;vertical-align:middle}
  .typing{color:var(--mute);font-size:14px}
  .card{background:var(--bone);padding:14px 16px;border-radius:12px;margin:8px 0 14px;font-size:14px}
  .card b{display:block;margin-bottom:4px;font-weight:600}
  .card .row{display:flex;gap:10px;margin-top:10px}
  .card button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--ink);background:var(--paper)}
  .card button.yes{background:var(--ink);color:var(--paper)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .chips button{white-space:nowrap;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper)}
  form{display:flex;gap:8px;padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--rule);background:var(--paper)}
  input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--rule);border-radius:999px;outline:none}
  input:focus{border-color:var(--ink)}
  form button{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:18px;flex:none}
  form button.mic{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
  form button.mic.live{background:#c00;color:#fff;border-color:#c00}
  .room{margin-bottom:22px}
  .room h3{font-size:12px;font-weight:500;color:var(--mute);margin-bottom:8px}
  .dev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .dev .st{color:var(--mute);font-size:13px;text-align:right;flex:none}
  .dev .st.on{color:var(--ink);font-weight:500}
  .item{padding:14px 0;border-bottom:1px solid var(--rule)}
  .item .t{font-size:12px;color:var(--mute);margin-bottom:4px}
  .item .q{font-size:14px;color:var(--mute)}
  .item .a{font-size:15px;line-height:1.4;margin-top:4px;white-space:pre-wrap}
  .brief{background:var(--bone);padding:16px;border-radius:12px;margin-bottom:16px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .brief small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
  .empty{color:var(--mute);font-size:14px;padding:30px 0;text-align:center}
  .pill{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--paper);margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="wordmark">BINA</div>
  <div class="house" id="houseName"></div>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="chat">Chat</button>
  <button role="tab" data-tab="house">House</button>
  <button role="tab" data-tab="feed">Feed</button>
</nav>
<main>
  <section id="chat" class="on">
    <div class="chips" id="chips"></div>
    <div id="log"></div>
  </section>
  <section id="house"><div class="empty">…</div></section>
  <section id="feed"><div class="empty">…</div></section>
</main>
<form id="f" autocomplete="off">
  <input id="in" placeholder="Tell Bina…" enterkeyhint="send">
  <button type="button" class="mic" id="mic" aria-label="Voice">●</button>
  <button type="submit" aria-label="Send">↑</button>
</form>

<script>
const USER = localStorage.getItem("bina_user") || "owner";
const H = { "Content-Type": "application/json", "X-Bina-User": USER };
const $ = (s) => document.querySelector(s);
const log = $("#log");
let LANG = "en";
const T = {
  en: { hi: "Hi. What would you like the house to do?", chips: ["What's on right now?", "Movie night", "I'm leaving", "Good night", "Who came to the door today?", "Any door open?"], confirm: "Confirm this action?", routine: "Add this routine?", cancel: "Cancel", ok: "Confirm", offline: "Bina is offline. Check the hub.", brief: "Morning brief now", writing: "Writing…", norooms: "No rooms yet. Assign devices to areas in Home Assistant.", other: "Other", nothing: "Nothing yet.", ph: "Tell Bina…" },
  es: { hi: "Hola. ¿Qué hacemos en la casa?", chips: ["¿Qué está prendido?", "Modo cine", "Me voy", "Buenas noches", "¿Quién vino hoy?", "¿Hay alguna puerta abierta?"], confirm: "¿Confirmas esta acción?", routine: "¿Agrego esta rutina?", cancel: "Cancelar", ok: "Confirmar", offline: "Bina está fuera de línea. Revisa el hub.", brief: "Resumen de hoy", writing: "Escribiendo…", norooms: "Sin cuartos todavía. Asigna dispositivos a áreas en Home Assistant.", other: "Otros", nothing: "Nada todavía.", ph: "Dile a Bina…" }
};
const t = (k) => (T[LANG] || T.en)[k];

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
  if (b.dataset.tab === "house") loadHouse();
  if (b.dataset.tab === "feed") loadFeed();
});

const plain = (x) => String(x).replace(/\*\*(.*?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "").replace(/`/g, "");
let hist = []; try { hist = JSON.parse(localStorage.getItem("bina_hist") || "[]"); } catch {}
const saveHist = () => localStorage.setItem("bina_hist", JSON.stringify(hist.slice(-60)));
function add(cls, text, persist = true) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = cls.includes("bina") ? plain(text) : text; log.appendChild(d);
  d.scrollIntoView({ block: "end" });
  if (persist && !cls.includes("typing")) { hist.push({ cls, text }); saveHist(); }
  return d;
}

function confirmCard(c) {
  const d = document.createElement("div"); d.className = "card";
  const what = c.kind === "service" ? `${c.service.replace(/_/g, " ")}: ${c.entity_ids.map(e => e.split(".")[1].replace(/_/g, " ")).join(", ")}` : c.summary;
  d.innerHTML = `<b>${c.kind === "service" ? t("confirm") : t("routine")}</b>${what}<div class="row"><button type="button" class="no">${t("cancel")}</button><button type="button" class="yes">${t("ok")}</button></div>`;
  const send = async (approve) => {
    d.querySelectorAll("button").forEach(b => b.disabled = true);
    const r = await fetch(`api/confirm/${c.id}`, { method: "POST", headers: H, body: JSON.stringify({ approve }) }).then(r => r.json()).catch(() => ({ error: t("offline") }));
    d.remove(); add("bina", r.reply || r.error || "OK");
  };
  d.querySelector(".yes").onclick = () => send(true);
  d.querySelector(".no").onclick = () => send(false);
  log.appendChild(d); d.scrollIntoView({ block: "end" });
}

async function send(text) {
  text = (text || "").trim(); if (!text) return;
  add("me", text); $("#in").value = "";
  const w = add("bina typing", "…", false);
  try {
    const r = await fetch("api/chat", { method: "POST", headers: H, body: JSON.stringify({ text }) }).then(r => r.json());
    w.remove(); if (r.reply) add("bina", r.reply); (r.confirmations || []).forEach(confirmCard);
  } catch (e) { w.textContent = t("offline"); w.classList.remove("typing"); }
}
$("#f").onsubmit = (e) => { e.preventDefault(); send($("#in").value); };

// voice: browser speech recognition (Chrome, Android, iOS Safari)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("#mic");
if (!SR) mic.style.display = "none";
else {
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = LANG === "es" ? "es-US" : LANG === "he" ? "he-IL" : "en-US"; rec.interimResults = false;
    mic.classList.add("live");
    rec.onresult = (e) => { const s = e.results[0][0].transcript; $("#in").value = s; send(s); };
    rec.onend = () => { mic.classList.remove("live"); rec = null; };
    rec.onerror = () => { mic.classList.remove("live"); rec = null; };
    rec.start();
  };
}

const nice = (id) => id.split(".")[1].replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const parse = (l) => { const m = l.match(/^(\S+)(?: \((.*?)\))?=(.*)$/); return m ? { id: m[1], name: m[2] || nice(m[1]), st: m[3] } : { id: l, name: l, st: "" }; };
async function loadHouse() {
  const h = await fetch("api/house").then(r => r.json()).catch(() => null);
  const el = $("#house"); if (!h) return el.innerHTML = `<div class="empty">${t("offline")}</div>`;
  const room = (name, devices) => `<div class="room"><h3>${name}</h3>${devices.map(parse).map(d => {
    const on = !/^(off|closed|locked|unavailable|idle|standby|disarmed|paused)/.test(d.st);
    return `<div class="dev"><span>${d.name}</span><span class="st ${on ? "on" : ""}">${d.st}</span></div>`;
  }).join("")}</div>`;
  el.innerHTML = (h.rooms.map(r => room(r.room, r.devices)).join("") + (h.unassigned.length ? room(t("other"), h.unassigned) : "")) || `<div class="empty">${t("norooms")}</div>`;
}
async function loadFeed() {
  const f = await fetch("api/feed").then(r => r.json()).catch(() => []);
  const el = $("#feed");
  el.innerHTML = `<button type="button" class="pill" id="briefBtn">${t("brief")}</button>` + (f.length ? f.map(i => `<div class="item"><div class="t">${new Date(i.t).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })} · ${i.who}</div><div class="q">${i.text}</div><div class="a">${plain(i.reply)}</div></div>`).join("") : `<div class="empty">${t("nothing")}</div>`);
  $("#briefBtn").onclick = async () => { $("#briefBtn").textContent = t("writing"); const r = await fetch("api/brief", { headers: H }).then(r => r.json()).catch(() => ({ error: t("offline") })); el.insertAdjacentHTML("afterbegin", `<div class="brief"><small>Bina</small>${plain(r.brief || r.error)}</div>`); $("#briefBtn").textContent = t("brief"); };
}

(async () => {
  try { const me = await fetch("api/me").then(r => r.json()); LANG = me.language || "en"; $("#houseName").textContent = me.house; } catch {}
  $("#in").placeholder = t("ph");
  $("#chips").innerHTML = t("chips").map(c => `<button type="button">${c}</button>`).join("");
  $("#chips").querySelectorAll("button").forEach(b => b.onclick = () => send(b.textContent));
  if (hist.length) hist.forEach(m => add(m.cls, m.text, false)); else add("bina", t("hi"));
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
